aid: vecna-robotics
name: Vecna Robotics
description: 'Vecna Robotics is a Waltham, Massachusetts material-handling automation
  company, spun out of Vecna Technologies in 2018, that builds autonomous mobile robots
  (AMRs) — autonomous forklifts, pallet trucks, tuggers, conveyor and lifter platforms
  — together with Pivotal, its end-to-end orchestration software suite for warehouse
  and manufacturing operations. Pivotal spans Orchestration (real-time task allocation
  and routing), Autonomous Navigation (3D lidar/vision sensor fusion), Insights (analytics
  and KPI dashboards), Integrations (WMS / MES / ERP, barcode scanning, on-robot and
  remote tablet UIs, call buttons, smart I/O) and the Pivotal Command Center, a 24/7
  human-in-the-loop teleoperation and remote monitoring service. Vecna sells the fleet
  as Robots-as-a-Service (RaaS) alongside the CaseFlow case-picking solution, and markets
  "flexible API integrations" into existing WMS/WES environments — but publishes no
  public developer portal, API reference, or machine-readable API contract as of this
  profiling pass. The only anonymous machine-readable surface found is the OpenID Connect
  discovery document served by its Salesforce Experience Cloud partner portal.'
