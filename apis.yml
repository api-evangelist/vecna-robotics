  description: 'OpenID Connect / OAuth 2.0 identity endpoints served from the Vecna
    Robotics partner portal host (vecnarobotics.my.site.com), a Salesforce Experience
    Cloud community. The discovery document at /.well-known/openid-configuration is
    served anonymously and advertises authorization, token, userinfo, revocation, introspection,
    dynamic-registration and JWKS endpoints plus the platform scope set. This is the
    partner-portal identity surface, not a Vecna Robotics product API — Vecna publishes
    no public product API contract.'
